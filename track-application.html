<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سديد — متابعة الطلب</title><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#f8f7fa;color:#203a4b;font:15px/1.8 'IBM Plex Sans Arabic',Tahoma,sans-serif}.wrap{max-width:800px;padding:20px;margin:auto}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:26px;color:#122e49;font-weight:700}a{text-decoration:none;color:#122e49}.button{padding:10px 16px;background:white;border:1px solid #cbd1dd;border-radius:10px;cursor:pointer;font:inherit}.hero{background:#122e49;color:white;border-radius:18px;padding:25px;margin:20px 0}.card{background:#fff;border:1px solid #e4e1eb;border-radius:16px;padding:24px;margin:13px 0}.muted{color:#657584}.line{border-bottom:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between;gap:10px}.status{background:#f4eae5;padding:9px;border-radius:10px}.tiny{font-size:12px;color:#677784}input{border:1px solid #d0d4df;border-radius:10px;font:inherit;padding:12px;width:100%}</style></head><body><header class="wrap nav"><a href="index.html" class="brand">سديد | Sadeed</a><div><a href="index.html" class="button" id="home">الرئيسية</a> <button onclick="swap()" class="button" id="language">English</button></div></header><main class="wrap"><div class="hero"><h1 id="title">متابعة الطلب</h1><p id="subtitle">اعرض حالة الطلب التجريبي المحفوظ في هذا المتصفح</p></div><div class="card"><label id="label">رقم الطلب التجريبي</label><input id="id" placeholder="SAD-1234567"><button class="button" onclick="find()" style="margin-top:12px" id="search">بحث</button><div id="result"></div></div><p class="tiny" id="disclaimer">هذا النموذج لا يتصل بالمصرف. طلبات هذا الجهاز وحده هي التي تظهر هنا؛ لا تُدخل بيانات حقيقية.</p></main><script>let lang=localStorage.getItem('sadeed-language')||'ar';const txt={ar:{home:'الرئيسية',title:'متابعة الطلب',subtitle:'اعرض حالة الطلب التجريبي المحفوظ في هذا المتصفح',label:'رقم الطلب التجريبي',search:'بحث',disclaimer:'هذا النموذج لا يتصل بالمصرف. طلبات هذا الجهاز وحده هي التي تظهر هنا؛ لا تُدخل بيانات حقيقية.',none:'لم يُعثر على الطلب في هذا المتصفح.',company:'الشركة',amount:'المبلغ',status:'الحالة',notes:'ملاحظات مدير العلاقة',statuses:{'rm-review':'قيد مراجعة مدير العلاقة','docs-needed':'مطلوب مستندات إضافية','credit-review':'محال للدراسة الائتمانية','demo-completed':'اكتملت المحاكاة'}},en:{home:'Home',title:'Track Application',subtitle:'Check the status of a fictional application saved in this browser',label:'Demo Application ID',search:'Search',disclaimer:'This demo is not connected to the bank. Only applications stored in this browser can be found; do not enter real information.',none:'Application not found in this browser.',company:'Company',amount:'Amount',status:'Status',notes:'Relationship Manager Notes',statuses:{'rm-review':'Pending Relationship Manager Review','docs-needed':'Additional Documents Required','credit-review':'Referred for Credit Review','demo-completed':'Demo Completed'}}};function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function swap(){lang=lang==='ar'?'en':'ar';localStorage.setItem('sadeed-language',lang);render()}function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';for(let k of ['home','title','subtitle','label','search','disclaimer'])document.getElementById(k).textContent=txt[lang][k];document.getElementById('language').textContent=lang==='ar'?'English':'العربية';find()}function find(){let id=document.getElementById('id').value.trim();let arr;try{arr=JSON.parse(localStorage.getItem('sadeed-demo-apps')||'[]')}catch{arr=[]}if(!id&&arr.length){id=arr[0].id;document.getElementById('id').value=id}if(!id){document.getElementById('result').innerHTML='';return}let r=arr.find(x=>x.id===id),t=txt[lang];document.getElementById('result').innerHTML=r?`<div class="card"><div class="line"><span>${t.company}</span><b>${esc(r.company)}</b></div><div class="line"><span>${t.amount}</span><b>${Number(r.amount).toLocaleString(lang==='ar'?'ar-SA':'en-US')} ${lang==='ar'?'ر.س':'SAR'}</b></div><div class="line"><span>${t.status}</span><b class="status">${t.statuses[r.status]||esc(r.status)}</b></div><div class="line"><span>${t.notes}</span><span>${esc(r.notes||'—')}</span></div></div>`:`<p class="muted">${t.none}</p>`}render();</script></body></html>
