<main class="container main">

  <div><div class="metric-label" data-i18n="sector"></div><strong id="companySector"></strong></div>
  <div><div class="metric-label" data-i18n="purpose"></div><strong id="companyPurpose"></strong></div>
  <div><div class="metric-label" data-i18n="appId"></div><strong id="appId" dir="ltr"></strong></div>
 </div><div class="spacer-16"></div><div class="form-grid"><label class="field"><span data-i18n="companyNameLabel">اسم الشركة</span><input id="companyNameInput" type="text" maxlength="100" autocomplete="off" data-i18n-placeholder="companyNamePlaceholder" placeholder="اسم الشركة" aria-label="Company name"></label><label class="field"><span data-i18n="sector">القطاع</span><input id="sectorInput" type="text" list="sectorSuggestions" maxlength="120" autocomplete="off" data-i18n-placeholder="sectorPlaceholder" placeholder="القطاع (اختياري)" aria-label="Sector"></label>
<label class="field"><span data-i18n="purpose">الغرض من التمويل</span><input id="purposeInput" type="text" list="purposeSuggestions" maxlength="120" autocomplete="off" data-i18n-placeholder="purposePlaceholder" placeholder="الغرض من التمويل (اختياري)" aria-label="Financing purpose"></label></div><datalist id="sectorSuggestions">
  <option value="Trading / التجارة"></option><option value="Manufacturing / التصنيع"></option><option value="Services / الخدمات"></option><option value="Construction / المقاولات"></option><option value="Technology / التقنية"></option><option value="Healthcare / الرعاية الصحية"></option><option value="Logistics / الخدمات اللوجستية"></option><option value="Agriculture / الزراعة"></option><option value="Real Estate / العقارات"></option>
</datalist>
<datalist id="purposeSuggestions">

</datalist></div>
 <div class="spacer-24"></div>

 <div class="card"><div class="form-grid">
  <label class="field"><span data-i18n="annualRevenue"></span><input id="annualRevenue" type="number" min="0" step="10000" inputmode="decimal"></label>
  <label class="field"><span data-i18n="requested"></span><input id="requestedAmount" type="number" min="0" step="10000" inputmode="decimal"></label>
  <label class="field"><span data-i18n="cash"></span><input id="cashAvailable" type="number" min="0" step="10000" inputmode="decimal"></label>
  <label class="field"><span data-i18n="existing"></span><input id="existingDebtService" type="number" min="0" step="10000" inputmode="decimal"></label>
  <label class="field"><span data-i18n="rate"></span><input id="rate" type="number" min="0" max="100" step="0.5" inputmode="decimal"></label>
  <label class="field"><span data-i18n="term"></span><input id="term" type="number" min="1" max="30" step="1" inputmode="numeric"></label>
 </div></div>
 <div class="spacer-24"></div>
 <div class="section-title"><h2 data-i18n="scenario">محاكي سيناريوهات السداد</h2><span class="badge badge-muted" data-i18n="demo">تجريبي</span></div>

  <section class="card"><div class="slider-box"><div class="slider-head"><span data-i18n="decline"></span><strong id="declineValue" dir="ltr">0%</strong></div><input id="decline" type="range" min="0" max="50" step="5" value="0" aria-label="Cash flow decline"><div class="range-ends"><span>0%</span><span>50%</span></div></div>
   <div class="spacer-16"></div><div class="info-pair"><span data-i18n="baseCF"></span><strong id="stressedCash" dir="ltr"></strong></div>
   <div class="info-pair"><span data-i18n="annualPay"></span><strong id="annualPayment" dir="ltr"></strong></div>
   <div class="info-pair"><span data-i18n="totalService"></span><strong id="totalAnnualService" dir="ltr"></strong></div>
   <div class="spacer-16"></div><div class="note" data-i18n="formula"></div>
  </section>
  <section class="card"><h3 data-i18n="dscr"></h3><div style="background:#f2f9f8;border-radius:13px;padding:24px;text-align:center;margin-bottom:16px"><div id="dscrValue" style="font-size:clamp(34px,5vw,48px);font-weight:900;color:#9184d7" dir="ltr">–</div><span id="coverageLabel" class="badge badge-blue"></span></div><p class="tiny" data-i18n="warning"></p></section>
 </div>
 <div class="spacer-24"></div>
 <section class="card"><h3 data-i18n="tableTitle"></h3><div class="table-scroll"><table class="data-table"><thead><tr><th data-i18n="case"></th><th data-i18n="stress"></th><th data-i18n="scenarioCash"></th><th data-i18n="ratio"></th></tr></thead><tbody id="scenarioRows"></tbody></table></div></section>
 <div class="spacer-24"></div>

  <div class="spacer-16"></div><div class="btns"><button type="button" class="btn" id="saveBtn" data-i18n="save"></button><button type="button" class="btn secondary" id="resetBtn" data-i18n="reset"></button><a class="btn secondary" href="track-application.html" data-i18n="goTrack"></a></div>
 </section><div class="spacer-16"></div><div class="notice" data-i18n="noReal"></div>
</main>
<footer><div class="container" data-i18n="foot"></div></footer><div class="toast" id="toast" role="status" aria-live="polite"></div>

       stepSubmitted:'Application Submitted',stepReview:'Under RM Review',stepDocuments:'Additional Documents Required',stepCredit:'Referred to Credit Team',
       stepSubmittedDesc:'Application recorded on the platform.',stepReviewDesc:'Review of financial information and financing needs.',stepDocumentsDesc:'Supporting documentation is required for assessment.',stepCreditDesc:'Application referred for credit assessment.',
       
       trackCurrent:'Current Status',trackAmount:'Requested Amount',trackPurpose:'Purpose',trackNext:'What Happens Next',nextSubmitted:'Awaiting RM review.',nextReview:'The RM is reviewing the details and may request documents.',nextDocuments:'Provide requested documents for further review.',nextCredit:'Awaiting the bank’s internal credit review process.',
       sectorPlaceholder:'Business sector (optional)',purposePlaceholder:'Financing purpose (optional)',notSelected:'Not specified',idPending:'Pending',
       security:'Prototype with fictional data and no live bank integration.',saveMsg:'Updated in this browser only.',resetMsg:'Prototype application data reset.',unavailable:'Local browser storage is unavailable.',
       currentBadge:'Status',updatedNow:'Recently',none:'Unavailable',numError:'Financial values must be non-negative and the term greater than zero.',riskAbove:'Illustrative DSCR above 1.25x',riskMid:'Illustrative DSCR between 1.00x and 1.25x',riskBelow:'Illustrative DSCR below 1.00x',foot:'Sadeed · Financial Decision Support Platform · Prototype',viewOther:'View other page',
       noReal:'Illustrative local data; no live submission to a bank.'}
};
const t=(key)=>translations[lang][key]||key;
function getApp(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return {...DEMO};const parsed=JSON.parse(raw);if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))return {...DEMO};const result={...DEMO,...parsed,status:STATES.includes(parsed.status)?parsed.status:'submitted'};
 // Older demo versions had a fixed reference number and fixed sample sector/purpose. Preserve user data without treating those old defaults as their choices.
 if(parsed.appVersion!==3){if(result.id==='FIN-DEMO-001')result.id='';if(result.sector==='Trading / التجارة')result.sector='';if(result.purpose==='Working Capital / رأس المال العامل')result.purpose='';}
 return result;}catch(e){return {...DEMO}}}
function createDemoId(){let rand;try{const a=new Uint32Array(1);crypto.getRandomValues(a);rand=a[0].toString(36).toUpperCase().padStart(7,'0');}catch(e){rand=Math.floor(Math.random()*4294967295).toString(36).toUpperCase().padStart(7,'0');}return 'FIN-DEMO-'+new Date().getFullYear()+'-'+Date.now().toString(36).slice(-5).toUpperCase()+'-'+rand;}
function saveApp(app){try{const id=app.id&&app.id!=='FIN-DEMO-001'?app.id:createDemoId();localStorage.setItem(STORE_KEY,JSON.stringify({...app,id,lastUpdated:new Date().toISOString(),demo:true,appVersion:3}));return true}catch(e){notify(t('unavailable'));return false}}
function money(n){return new Intl.NumberFormat(lang==='ar'?'ar-SA':'en-US',{maximumFractionDigits:0}).format(n||0)+' '+(lang==='ar'?'ر.س':'SAR')}
function number(n,dec=2){return new Intl.NumberFormat(lang==='ar'?'ar-SA':'en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}).format(n||0)}
function dateFmt(raw){if(!raw)return t('updatedNow');const d=new Date(raw);return isNaN(d)?t('updatedNow'):new Intl.DateTimeFormat(lang==='ar'?'ar-SA':'en-GB',{dateStyle:'medium',timeStyle:'short'}).format(d)}
function notify(message){let n=document.getElementById('toast');n.textContent=message;n.classList.add('show');clearTimeout(window._notifyTimeout);window._notifyTimeout=setTimeout(()=>n.classList.remove('show'),3200)}
function updateTranslations(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=t(e.dataset.i18nPlaceholder));document.getElementById('langSwitch').textContent=lang==='ar'?'English':'العربية';}
function initLang(callback){document.getElementById('langSwitch').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';updateTranslations();callback();});updateTranslations()}
function statusText(state){return t('step'+state[0].toUpperCase()+state.slice(1));}
function setStatusBadge(element,status){element.textContent=statusText(status);element.className='badge '+({'submitted':'badge-blue','review':'badge-amber','documents':'badge-amber','credit':'badge-green'}[status]||'badge-muted')}


const fields=['annualRevenue','requestedAmount','cashAvailable','existingDebtService','rate','term'];
let app=getApp();
function hydrate(){app=getApp();document.getElementById('companyName').textContent=app.companyName||t('nameMissing');document.getElementById('companyNameInput').value=app.companyName;document.getElementById('sectorInput').value=app.sector;document.getElementById('purposeInput').value=app.purpose;document.getElementById('companySector').textContent=app.sector||t('notSelected');document.getElementById('companyPurpose').textContent=app.purpose||t('notSelected');document.getElementById('appId').textContent=app.id||t('idPending');fields.forEach(f=>document.getElementById(f).value=app[f]);document.getElementById('statusSelect').value=app.status;setStatusBadge(document.getElementById('statusBadge'),app.status);document.getElementById('lastUpdated').textContent=dateFmt(app.lastUpdated);updateCalc();}
function payment(P,r,n){if(P===0)return 0;if(r===0)return P/n;return P*r/(1-Math.pow(1+r,-n));}
function getInputs(){const v={};for(const f of fields){const el=document.getElementById(f),num=Number(el.value);if(el.value.trim()===''||!Number.isFinite(num)||num<0) return null;v[f]=num;}if(v.term<=0||v.term>30||v.rate>100)return null;return v;}
function updateCalc(){const v=getInputs();if(!v){document.getElementById('dscrValue').textContent='–';document.getElementById('scenarioRows').replaceChildren();return;}
 const annualPayment=payment(v.requestedAmount,v.rate/100,v.term),annualService=v.existingDebtService+annualPayment,decline=Number(document.getElementById('decline').value),stressed=v.cashAvailable*(1-decline/100),coverage=annualService===0?null:stressed/annualService;
 document.getElementById('declineValue').textContent=decline+'%';document.getElementById('stressedCash').textContent=money(stressed);document.getElementById('annualPayment').textContent=money(annualPayment);document.getElementById('totalAnnualService').textContent=money(annualService);
 document.getElementById('dscrValue').textContent=coverage===null?'N/A':number(coverage)+'x';
 const label=document.getElementById('coverageLabel');label.textContent=coverage===null?'N/A':coverage>=1.25?t('riskAbove'):coverage>=1?t('riskMid'):t('riskBelow');label.className='badge '+(coverage===null?'badge-muted':coverage>=1.25?'badge-green':coverage>=1?'badge-amber':'badge-amber');
 const tbody=document.getElementById('scenarioRows');tbody.replaceChildren();for(const d of [0,10,20,30]){const cf=v.cashAvailable*(1-d/100),cov=annualService===0?'N/A':number(cf/annualService)+'x';const tr=document.createElement('tr');const items=[d===0?'Base / الأساس':'Stress / ضغط',d+'%',money(cf),cov];items.forEach((item,i)=>{const td=document.createElement('td');td.textContent=item;if(i===3)td.classList.add('emphasis');tr.appendChild(td)});tbody.appendChild(tr);}
}
document.getElementById('decline').addEventListener('input',updateCalc);
fields.forEach(f=>document.getElementById(f).addEventListener('input',updateCalc));
document.getElementById('saveBtn').addEventListener('click',()=>{const inputs=getInputs();if(!inputs){notify(t('numError'));return;}const name=document.getElementById('companyNameInput').value.trim();if(!name||name.length>100){notify(t('nameError'));document.getElementById('companyNameInput').focus();return;}const sector=document.getElementById('sectorInput').value.trim();const purpose=document.getElementById('purposeInput').value.trim();app={...getApp(),...inputs,companyName:name,sector,purpose,status:document.getElementById('statusSelect').value};if(saveApp(app)){hydrate();notify(t('saveMsg'))}});
document.getElementById('resetBtn').addEventListener('click',()=>{try{localStorage.removeItem(STORE_KEY)}catch(e){}document.getElementById('decline').value=0;hydrate();notify(t('resetMsg'))});
window.addEventListener('storage',hydrate);initLang(hydrate);hydrate();
</script></body></html>
